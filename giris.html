<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CPM Pazar | Giriş & Kayıt</title>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>
    <style>
        body { background: #0a0a0a; color: white; font-family: sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .login-box { background: #111; padding: 30px; border-radius: 15px; border: 1px solid #ffcc00; width: 320px; text-align: center; box-shadow: 0 0 20px rgba(255, 204, 0, 0.1); }
        input { width: 100%; padding: 12px; margin: 10px 0; border-radius: 8px; border: 1px solid #333; background: #1a1a1a; color: white; box-sizing: border-box; outline: none; }
        input:focus { border-color: #ffcc00; }
        button { width: 100%; padding: 12px; background: #ffcc00; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; margin-top: 10px; transition: 0.3s; }
        button:hover { background: #e6b800; }
        .switch { font-size: 12px; color: #888; margin-top: 15px; cursor: pointer; text-decoration: underline; }
        #adminKodAlani { display: none; } /* Başlangıçta gizli */
    </style>
</head>
<body>

<div class="login-box">
    <h2 id="baslik" style="color:#ffcc00; margin-bottom: 20px;">Giriş Yap</h2>
    <input type="text" id="user" placeholder="Kullanıcı Adı">
    <input type="password" id="pass" placeholder="Şifre">
    
    <div id="adminKodAlani">
        <input type="text" id="adminCode" placeholder="Admin Kayıt Kodu (Opsiyonel)">
    </div>

    <button id="anaBtn" onclick="islemYap()">GİRİŞ YAP</button>
    <p class="switch" id="modDegis" onclick="moduDegistir()">Hesabın yok mu? Kayıt Ol</p>
</div>

<script>
    const firebaseConfig = {
        apiKey: "AIzaSyCDq7tCjNddgyEa-E3uYWLXNDY05f-bzzY",
        authDomain: "cpm-market-6d2cb.firebaseapp.com",
        databaseURL: "https://cpm-market-6d2cb-default-rtdb.firebaseio.com",
        projectId: "cpm-market-6d2cb",
        storageBucket: "cpm-market-6d2cb.firebasestorage.app",
        messagingSenderId: "47092040708",
        appId: "1:47092040708:web:8a811a9c4a77759a1ce151"
    };

    firebase.initializeApp(firebaseConfig);
    const database = firebase.database();
    let mod = "login";

    function moduDegistir() {
        const kodAlani = document.getElementById('adminKodAlani');
        if(mod === "login") {
            mod = "register";
            document.getElementById('baslik').innerText = "Kayıt Ol";
            document.getElementById('anaBtn').innerText = "KAYIT OL";
            document.getElementById('modDegis').innerText = "Zaten hesabın var mı? Giriş Yap";
            kodAlani.style.display = "block"; // Kayıtta admin kodunu göster
        } else {
            mod = "login";
            document.getElementById('baslik').innerText = "Giriş Yap";
            document.getElementById('anaBtn').innerText = "GİRİŞ YAP";
            document.getElementById('modDegis').innerText = "Hesabın yok mu? Kayıt Ol";
            kodAlani.style.display = "none"; // Girişte gizle
        }
    }

    function islemYap() {
        const u = document.getElementById('user').value.trim().toLowerCase();
        const p = document.getElementById('pass').value;
        const aCode = document.getElementById('adminCode').value;

        if(!u || !p) return alert("Kullanıcı adı ve şifre boş olamaz!");

        if(mod === "register") {
            database.ref('kullanicilar/' + u).get().then((snap) => {
                if(snap.exists()) {
                    alert("Bu kullanıcı adı zaten alınmış!");
                } else {
                    // Admin kodu kontrolü (Senin eski kodun: 313131)
                    let rol = "user";
                    if(aCode === "313131") { 
                        rol = "admin";
                        alert("Admin yetkisi onaylandı!");
                    }

                    database.ref('kullanicilar/' + u).set({
                        sifre: p,
                        rol: rol
                    }).then(() => {
                        alert("Kayıt başarılı! Şimdi giriş yapabilirsin.");
                        moduDegistir(); // Giriş moduna geri dön
                    });
                }
            });
        } else {
            database.ref('kullanicilar/' + u).get().then((snap) => {
                if(snap.exists() && snap.val().sifre === p) {
                    localStorage.setItem('oturum', u);
                    localStorage.setItem('rol', snap.val().rol);
                    window.location.href = "index.html";
                } else {
                    alert("Hatalı kullanıcı adı veya şifre!");
                }
            });
        }
    }
</script>
</body>
</html>
