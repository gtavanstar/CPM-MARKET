<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CPM Pazar | Giriş Yap</title>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>
    <style>
        body { background: #0a0a0a; color: white; font-family: 'Segoe UI', sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .box { background: #111; padding: 30px; border-radius: 15px; border: 1px solid #ffcc00; width: 320px; text-align: center; box-shadow: 0 0 20px rgba(255, 204, 0, 0.2); }
        h2 { color: #ffcc00; margin-bottom: 20px; }
        input { width: 100%; padding: 12px; margin: 10px 0; border-radius: 8px; border: 1px solid #333; background: #1a1a1a; color: white; box-sizing: border-box; outline: none; }
        input:focus { border-color: #ffcc00; }
        button { width: 100%; padding: 12px; background: #ffcc00; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; margin-top: 10px; transition: 0.3s; }
        button:hover { background: #e6b800; }
        .link { font-size: 13px; color: #888; margin-top: 20px; display: block; text-decoration: none; }
    </style>
</head>
<body>

<div class="box">
    <h2>Giriş Yap</h2>
    <input type="text" id="user" placeholder="Kullanıcı Adı">
    <input type="password" id="pass" placeholder="Şifre">

    <button onclick="girisYap()">GİRİŞ YAP</button>
    <a href="kayit.html" class="link">Hesabın yok mu? Kayıt Ol</a>
</div>

<script>
    // Firebase Ayarları (Senin ayarlarınla aynı)
    const firebaseConfig = {
        apiKey: "AIzaSyCDq7tCjNddgyEa-E3uYWLXNDY05f-bzzY",
        authDomain: "cpm-market-6d2cb.firebaseapp.com",
        databaseURL: "https://cpm-market-6d2cb-default-rtdb.firebaseio.com",
        projectId: "cpm-market-6d2cb",
        storageBucket: "cpm-market-6d2cb.firebasestorage.app",
        messagingSenderId: "47092040708",
        appId: "1:47092040708:web:8a811a9c4a77759a1ce151"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    function girisYap() {
        const u = document.getElementById('user').value.trim().toLowerCase();
        const p = document.getElementById('pass').value;

        if(!u || !p) return alert("Bilgileri gir kanka!");

        // Firebase'den bu kullanıcıyı çek
        db.ref('kullanicilar/' + u).get().then((s) => {
            if(s.exists()) {
                const veriler = s.val();
                
                // Şifre kontrolü
                if(veriler.sifre === p) {
                    // Oturumu tarayıcıya kaydet
                    localStorage.setItem('oturum', u);
                    localStorage.setItem('rol', veriler.rol);
                    
                    alert("Giriş başarılı! Yönlendiriliyorsun...");
                    window.location.href = "index.html"; // Ana sayfaya uçur
                } else {
                    alert("Şifre hatalı kral!");
                }
            } else {
                alert("Böyle bir kullanıcı yok. Önce kayıt ol!");
            }
        }).catch(err => {
            alert("Sistem hatası: " + err.message);
        });
    }
</script>
</body>
</html>
