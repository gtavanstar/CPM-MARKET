<!DOCTYPE html>
<html lang="tr">
<head>
    <link rel="icon" type="image/jpeg" href="favicon.jpg">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CPM MARKET | Pazar (Online)</title>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; }
        body { background: #0a0a0a; color: #fff; padding-bottom: 50px; }
        
        /* Header Ayarları */
        header { background: #111; padding: 15px 5%; display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #ffcc00; position: sticky; top: 0; z-index: 1000; }
        .logo { color: #ffcc00; font-size: 22px; font-weight: 900; letter-spacing: 1px; }
        
        /* 🚨 KRİTİK UYARI KUTUSU */
        .pazar-uyari { background: rgba(255, 68, 68, 0.1); border: 1px dashed #ff4444; padding: 15px; margin: 20px 5%; border-radius: 10px; text-align: center; animation: glow 2s infinite; }
        @keyframes glow { 0% { border-color: #ff4444; } 50% { border-color: #ffcc00; } 100% { border-color: #ff4444; } }
        
        .search-container { background: #111; padding: 20px 5%; display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
        #searchBox { flex: 1; min-width: 200px; padding: 12px; background: #1a1a1a; border: 1px solid #333; color: #fff; border-radius: 8px; outline: none; }
        
        .btn-tab { background: #222; color: #888; border: none; padding: 10px 15px; cursor: pointer; border-radius: 8px; font-weight: bold; font-size: 13px; transition: 0.3s; }
        .btn-tab.active { background: #ffcc00; color: #000; }
        
        /* İlan Kartları */
        .ilan-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 25px; padding: 10px 5%; }
        .kart { background: #161616; border: 1px solid #222; border-radius: 15px; overflow: hidden; position: relative; transition: 0.3s; display: flex; flex-direction: column; }
        .kart:hover { border-color: #ffcc00; transform: translateY(-5px); }
        
        .badge { position: absolute; top: 10px; right: 10px; padding: 5px 10px; border-radius: 6px; font-size: 10px; font-weight: bold; z-index: 10; background: #ffcc00; color: #000; box-shadow: 0 0 10px rgba(255,204,0,0.3); }
        .araba-img { width: 100%; height: 180px; object-fit: cover; background: #222; }
        
        .kart-body { padding: 15px; flex-grow: 1; }
        .fiyat { color: #ffcc00; font-size: 22px; font-weight: 800; margin-bottom: 5px; }
        .id-box { background: #222; padding: 8px; border-radius: 6px; font-size: 12px; color: #ffcc00; cursor: pointer; display: block; margin-top: 10px; border: 1px dashed #444; text-align: center; font-family: monospace; }
        
        .btn-rapor { background: none; color: #ff4444; border: 1px solid #ff4444; padding: 6px; border-radius: 6px; font-size: 11px; cursor: pointer; width: 100%; margin-top: 8px; font-weight: bold; transition: 0.3s; }
        .btn-rapor:hover { background: #ff4444; color: #fff; }
        
        .btn-sil { background: #ff4444; color: #fff; border: none; padding: 10px; border-radius: 6px; cursor: pointer; width: 100%; margin-top: 10px; font-weight: bold; }
        .btn-admin { background: #ff4444; color: white; padding: 8px 12px; text-decoration: none; border-radius: 5px; font-size: 12px; font-weight: bold; }
        
        .chat-container { background: #111; padding: 10px; border-top: 1px solid #222; max-height: 120px; overflow-y: auto; }
    </style>
</head>
<body>

<header>
    <div class="logo">CPM MARKET</div>
    <div class="user-info" style="display: flex; align-items: center; gap: 15px;">
        <a href="admin.html" id="adminBtn" class="btn-admin" style="display: none;">🛡️ ADMIN</a>
        <span id="aktifUser" style="color:#ffcc00; font-weight: bold;"></span>
        <button onclick="cikisYap()" style="background:#222; border:1px solid #444; color:#fff; padding: 5px 10px; border-radius: 5px; cursor:pointer; font-size: 11px;">ÇIKIŞ</button>
    </div>
</header>

<div class="pazar-uyari">
    <strong style="color: #ff4444;">📢 ÖNEMLİ DUYURU:</strong> 
    <span style="font-size: 14px; margin-left: 5px;">
        Lütfen <b>SATILAN</b> veya <b>ESKİ</b> ilanlarınızı siliniz! Pazarı temiz tutalım kanka. 🏎️💨
    </span>
</div>

<div class="search-container">
    <input type="text" id="searchBox" placeholder="Araç veya Satıcı Ara..." onkeyup="ilanlariGetir()">
    <button class="btn-tab active" id="tab-hepsi" onclick="tabSet('hepsi')">Tümü</button>
    <button class="btn-tab" id="tab-benim" onclick="tabSet('benim')">İlanlarım</button>
    <a href="ilan-ver.html" style="background:#ffcc00; color:#000; padding:12px 20px; text-decoration:none; border-radius:8px; font-weight:bold; box-shadow: 0 4px 15px rgba(255,204,0,0.2);">+ İLAN VER</a>
</div>

<div class="ilan-grid" id="anaListe">
    </div>

<script>
    const firebaseConfig = {
        apiKey: "AIzaSyCDq7tCjNddgyEa-E3uYWLXNDY05f-bzzY",
        authDomain: "cpm-market-6d2cb.firebaseapp.com",
        databaseURL: "https://cpm-market-6d2cb-default-rtdb.firebaseio.com",
        projectId: "cpm-market-6d2cb",
        storageBucket: "cpm-market-6d2cb.firebasestorage.app",
        messagingSenderId: "47092040708",
        appId: "1:47092040708:web:8a811a9c4a77759a1ce151"
    };

    firebase.initializeApp(firebaseConfig);
    const database = firebase.database();
    
    const girisYapan = localStorage.getItem('oturum');
    const kullaniciRolu = localStorage.getItem('rol');
    let aktifTab = 'hepsi';

    if(!girisYapan) window.location.href = "giris.html";
    if(kullaniciRolu === "admin") document.getElementById('adminBtn').style.display = "block";
    document.getElementById('aktifUser').innerText = "@" + girisYapan;

    function tabSet(t) {
        aktifTab = t;
        document.querySelectorAll('.btn-tab').forEach(b => b.classList.remove('active'));
        document.getElementById('tab-' + t).classList.add('active');
        ilanlariGetir();
    }

    function ilanlariGetir() {
        const arama = document.getElementById('searchBox').value.toLowerCase();
        const liste = document.getElementById('anaListe');
        
        database.ref('arabalar').on('value', (snapshot) => {
            liste.innerHTML = "";
            snapshot.forEach((childSnapshot) => {
                const araba = childSnapshot.val();
                const fbId = childSnapshot.key;

                if (aktifTab === 'benim' && araba.sahibi !== girisYapan) return;
                if (arama && !(araba.baslik.toLowerCase().includes(arama) || araba.sahibi.toLowerCase().includes(arama))) return;

                const resim = araba.foto || "https://dummyimage.com/300x180/222/555&text=FOTO+YOK";
                
                let mesajlarHtml = "";
                if(araba.mesajlar) {
                    Object.values(araba.mesajlar).slice(-3).forEach(m => { // Son 3 mesajı göster
                        mesajlarHtml += `<div style="font-size:11px; margin-bottom:3px; border-left: 2px solid #ffcc00; padding-left: 5px;"><b style="color:#ffcc00;">${m.gonderen}:</b> ${m.metin}</div>`;
                    });
                }

                const silButon = (kullaniciRolu === "admin" || araba.sahibi === girisYapan) 
                    ? `<button class="btn-sil" onclick="ilanSil('${fbId}')">İLANIMI SİL</button>` : '';

                liste.innerHTML += `
                    <div class="kart">
                        ${araba.etiket ? `<div class="badge">${araba.etiket}</div>` : ''}
                        <img src="${resim}" class="araba-img">
                        <div class="kart-body">
                            <div class="fiyat">${araba.fiyat}</div>
                            <div style="font-weight:bold; font-size:16px;">${araba.baslik}</div>
                            <div style="font-size:12px; color:#888; margin-top:5px;">👤 Satıcı: @${araba.sahibi}</div>
                            <div class="id-box" onclick="idKopyala('${araba.km}')">🆔 ID: ${araba.km} (Kopyala)</div>
                            <button class="btn-rapor" onclick="ilanRaporla('${araba.baslik}', '${araba.sahibi}', '${araba.km}')">🚫 İLANI RAPORLA</button>
                            ${silButon}
                        </div>
                        <div class="chat-container">
                            ${mesajlarHtml || '<span style="color:#444; font-size:11px;">Henüz teklif yok...</span>'}
                        </div>
                        <div style="display:flex; padding:8px; background:#1a1a1a; border-top:1px solid #222;">
                            <input type="text" id="input-${fbId}" placeholder="Pazarlık yap..." style="flex:1; background:#222; border:1px solid #333; color:white; padding:8px; font-size:12px; border-radius:5px; outline:none;">
                            <button onclick="mesajGonder('${fbId}')" style="background:#ffcc00; border:none; padding:5px 12px; margin-left:5px; cursor:pointer; border-radius:5px; font-weight:bold;">></button>
                        </div>
                    </div>`;
            });
        });
    }

    function mesajGonder(id) {
        const msgInput = document.getElementById('input-' + id);
        const mesaj = msgInput.value;
        if(!mesaj) return;

        database.ref('arabalar/' + id + '/mesajlar').push({
            gonderen: girisYapan,
            metin: mesaj,
            tarih: Date.now()
        }).then(() => {
            msgInput.value = ""; 
        });
    }

    function ilanRaporla(baslik, sahibi, id) {
        const sebep = prompt("Neden raporluyorsunuz? (Hatalı ID, Küfür, Dolandırıcılık)");
        if(!sebep) return;

        database.ref('raporlar').push({
            ilan: baslik,
            sahibi: sahibi,
            aracId: id,
            sikayetEden: girisYapan,
            neden: sebep,
            tarih: new Date().toLocaleString()
        }).then(() => {
            alert("Rapor merkeze ulaştı kanka. Admin en kısa sürede bakacak!");
        });
    }

    function ilanSil(id) {
        if(confirm("Bu ilanı silmek istediğine emin misin? (İşlem geri alınamaz)")) {
            database.ref('arabalar/' + id).remove();
        }
    }

    function idKopyala(id) {
        navigator.clipboard.writeText(id);
        alert("ID Kopyalandı! Oyuna girince yapıştırabilirsin.");
    }

    function cikisYap() {
        localStorage.clear();
        window.location.href="giris.html";
    }
    
    window.onload = ilanlariGetir;
</script>
</body>
</html>
