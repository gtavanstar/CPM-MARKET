<!DOCTYPE html>
<html lang="tr">
<head>
    <link rel="icon" type="image/jpeg" href="favicon.jpg">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Car Parking | Pazar (Online)</title>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; }
        body { background: #0a0a0a; color: #fff; padding-bottom: 50px; }
        header { background: #111; padding: 15px 5%; display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #ffcc00; position: sticky; top: 0; z-index: 1000; }
        .logo { color: #ffcc00; font-size: 22px; font-weight: 900; }
        .search-container { background: #111; padding: 20px 5%; display: flex; gap: 10px; flex-wrap: wrap; }
        #searchBox { flex: 1; min-width: 200px; padding: 12px; background: #1a1a1a; border: 1px solid #333; color: #fff; border-radius: 8px; outline: none; }
        .btn-tab { background: #222; color: #888; border: none; padding: 10px 15px; cursor: pointer; border-radius: 8px; font-weight: bold; font-size: 13px; }
        .btn-tab.active { background: #ffcc00; color: #000; }
        .container { padding: 0 5% 30px 5%; }
        .ilan-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 25px; }
        .kart { background: #161616; border: 1px solid #222; border-radius: 15px; overflow: hidden; position: relative; display: flex; flex-direction: column; transition: 0.3s; }
        .kart:hover { border-color: #ffcc00; }
        .badge { position: absolute; top: 55px; right: 10px; padding: 5px 10px; border-radius: 6px; font-size: 10px; font-weight: bold; text-transform: uppercase; z-index: 10; box-shadow: 0 4px 10px rgba(0,0,0,0.5); }
        .badge-Hız { background: #ff4444; color: white; }
        .badge-Takaslık { background: #4444ff; color: white; }
        .badge-Koleksiyonluk { background: #aa44ff; color: white; }
        .badge-Acil { background: #ffcc00; color: black; border: 1px solid #000; }
        .badge-Efsane { background: #00ff00; color: black; }
        .araba-img { width: 100%; height: 180px; object-fit: cover; }
        .kart-body { padding: 15px; }
        .fiyat { color: #ffcc00; font-size: 22px; font-weight: 800; }
        .id-box { background: #222; padding: 6px; border-radius: 6px; font-size: 11px; color: #ffcc00; cursor: pointer; display: inline-block; margin-top: 8px; border: 1px dashed #444; width: 100%; text-align: center; font-weight: bold; }
        .btn-rapor { background: #ff444422; color: #ff4444; border: 1px solid #ff4444; padding: 6px; border-radius: 6px; font-size: 11px; cursor: pointer; margin-top: 5px; width: 100%; font-weight: bold; transition: 0.3s; }
        .btn-rapor:hover { background: #ff4444; color: #fff; }
        .sohbet-alani { background: #1a1a1a; padding: 10px; border-top: 1px solid #222; max-height: 100px; overflow-y: auto; font-size: 12px; }
        .mesaj b { color: #ffcc00; }
        .mesaj-input-grup { display: flex; padding: 10px; background: #111; gap: 5px; border-top: 1px solid #222; }
        .mesaj-input-grup input { flex: 1; background: #222; border: 1px solid #333; color: white; padding: 8px; border-radius: 5px; outline: none; }
        .mesaj-input-grup button { background: #ffcc00; border: none; padding: 5px 12px; cursor: pointer; font-weight: bold; border-radius: 5px; }
        .btn-sil { background: #ff444422; color: #ff4444; border: 1px solid #ff4444; padding: 8px; border-radius: 5px; cursor: pointer; width: 100%; margin-top: 10px; font-weight: bold; }
        .btn-admin { background: #ff4444; color: white; padding: 8px 12px; text-decoration: none; border-radius: 5px; font-size: 12px; display: none; }
    </style>
</head>
<body>

<header>
    <div class="logo">CAR PARKING MARKET</div>
    <div class="user-info">
        <a href="admin.html" id="adminBtn" class="btn-admin">🛡️ ADMIN</a>
        <span id="aktifUser" style="color:#888; font-size:13px;"></span>
        <button onclick="cikisYap()" style="background:none; border:none; color:red; cursor:pointer; font-size:12px;">ÇIKIŞ</button>
    </div>
</header>

<div class="search-container">
    <input type="text" id="searchBox" placeholder="Ara..." onkeyup="ilanlariGetir()">
    <button class="btn-tab active" id="tab-hepsi" onclick="tabSet('hepsi')">Tümü</button>
    <button class="btn-tab" id="tab-benim" onclick="tabSet('benim')">İlanlarım</button>
    <a href="ilan-ver.html" style="background:#ffcc00; color:#000; padding:10px 15px; text-decoration:none; border-radius:8px; font-weight:bold; font-size:13px;">+ İlan Ver</a>
</div>

<div class="container">
    <div class="ilan-grid" id="anaListe"></div>
</div>

<script>
    // --- FIREBASE AYARLARI ---
    const firebaseConfig = {
      apiKey: "AIzaSyCDq7tCjNddgyEa-E3uYWLXNDY05f-bzzY",
      authDomain: "cpm-market-6d2cb.firebaseapp.com",
      databaseURL: "https://cpm-market-6d2cb-default-rtdb.firebaseio.com", // Otomatik Tahmin Edildi
      projectId: "cpm-market-6d2cb",
      storageBucket: "cpm-market-6d2cb.firebasestorage.app",
      messagingSenderId: "47092040708",
      appId: "1:47092040708:web:b2969fe14800f1631ce151"
    };

    firebase.initializeApp(firebaseConfig);
    const database = firebase.database();

    const girisYapan = localStorage.getItem('oturum');
    const kullaniciRolu = localStorage.getItem('rol');
    let aktifTab = 'hepsi';

    if(!girisYapan) window.location.href = "giris.html";
    if(kullaniciRolu === "admin") document.getElementById('adminBtn').style.display = "block";
    document.getElementById('aktifUser').innerText = "@" + girisYapan;

    function tabSet(t) {
        aktifTab = t;
        document.querySelectorAll('.btn-tab').forEach(b => b.classList.remove('active'));
        document.getElementById('tab-' + t).classList.add('active');
        ilanlariGetir();
    }

    // --- ONLINE İLANLARI GETİR ---
    function ilanlariGetir() {
        const arama = document.getElementById('searchBox').value.toLowerCase();
        const liste = document.getElementById('anaListe');
        
        database.ref('arabalar').on('value', (snapshot) => {
            liste.innerHTML = "";
            const ilanlar = [];
            snapshot.forEach((childSnapshot) => {
                ilanlar.push({ firebaseId: childSnapshot.key, ...childSnapshot.val() });
            });

            const filtrelenmis = ilanlar.filter((araba) => {
                const aramaUygun = araba.baslik.toLowerCase().includes(arama);
                let tabUygun = true;
                if(aktifTab === 'benim') tabUygun = (araba.sahibi === girisYapan);
                return aramaUygun && tabUygun;
            });

            filtrelenmis.forEach((araba) => {
                const resim = araba.foto || "https://via.placeholder.com/300x180/222/555?text=FOTO+YOK";
                let etiketHtml = araba.etiket ? `<div class="badge badge-${araba.etiket.split(' ')[0].replace(/[🔥🔄💎⚠🎨]/g, '').trim()}">${araba.etiket}</div>` : "";
                
                let mesajlar = "";
                if(araba.mesajlar) {
                    Object.values(araba.mesajlar).forEach(m => {
                        mesajlar += `<div class="mesaj"><b>${m.gonderen}:</b> ${m.metin}</div>`;
                    });
                }

                const silButon = (kullaniciRolu === "admin" || araba.sahibi === girisYapan) 
                    ? `<button class="btn-sil" onclick="ilanSil('${araba.firebaseId}')">SİL</button>` : '';

                liste.innerHTML += `
                    <div class="kart">
                        ${etiketHtml}
                        <img src="${resim}" class="araba-img">
                        <div class="kart-body">
                            <div class="fiyat">${araba.fiyat}</div>
                            <div style="font-weight:bold;">${araba.baslik}</div>
                            <div style="font-size:12px; color:#555;">@${araba.sahibi}</div>
                            <div class="id-box" onclick="idKopyala('${araba.km}')">🆔 ID: ${araba.km || 'Bilinmiyor'}</div>
                            <button class="btn-rapor" onclick="ilanRaporla('${araba.baslik}', '${araba.sahibi}', '${araba.km}')">🚫 UYGUNSUZ İLAN RAPORLA</button>
                            ${silButon}
                        </div>
                        <div class="sohbet-alani">${mesajlar || 'Mesaj yok'}</div>
                        <div class="mesaj-input-grup">
                            <input type="text" id="in-${araba.firebaseId}" placeholder="Pazarlık...">
                            <button onclick="mesajAt('${araba.firebaseId}')">></button>
                        </div>
                    </div>
                `;
            });
        });
    }

    function mesajAt(fbId) {
        const txt = document.getElementById('in-' + fbId).value;
        if(!txt) return;
        database.ref('arabalar/' + fbId + '/mesajlar').push({
            gonderen: girisYapan,
            metin: txt
        });
        document.getElementById('in-' + fbId).value = "";
    }

    function ilanSil(fbId) {
        if(confirm("Bu ilanı herkes için silmek istediğine emin misin?")) {
            database.ref('arabalar/' + fbId).remove();
        }
    }

    function ilanRaporla(baslik, sahibi, id) {
        const sebep = prompt("Neden raporluyorsunuz? (+18, Dolandırıcılık vb.)");
        if(!sebep) return;
        const email = "coredeathplay@outlook.com.tr";
        const konu = "CPM RAPOR: " + baslik;
        const mesaj = `İlan: ${baslik}%0DSahibi: @${sahibi}%0DID: ${id}%0DSebep: ${sebep}`;
        window.location.href = `mailto:${email}?subject=${konu}&body=${mesaj}`;
    }

    function idKopyala(id) {
        navigator.clipboard.writeText(id);
        alert("ID Kopyalandı!");
    }

    function cikisYap() { localStorage.clear(); window.location.href="giris.html"; }
    window.onload = ilanlariGetir;
</script>
</body>
</html>
