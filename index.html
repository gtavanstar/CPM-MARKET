<!DOCTYPE html>
<html lang="tr">
<head>
    <link rel="icon" type="image/jpeg" href="favicon.jpg">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Car Parking | Pazar (Online)</title>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; }
        body { background: #0a0a0a; color: #fff; padding-bottom: 50px; }
        header { background: #111; padding: 15px 5%; display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #ffcc00; position: sticky; top: 0; z-index: 1000; }
        .logo { color: #ffcc00; font-size: 22px; font-weight: 900; }
        .search-container { background: #111; padding: 20px 5%; display: flex; gap: 10px; flex-wrap: wrap; }
        #searchBox { flex: 1; min-width: 200px; padding: 12px; background: #1a1a1a; border: 1px solid #333; color: #fff; border-radius: 8px; outline: none; }
        .btn-tab { background: #222; color: #888; border: none; padding: 10px 15px; cursor: pointer; border-radius: 8px; font-weight: bold; font-size: 13px; }
        .btn-tab.active { background: #ffcc00; color: #000; }
        .ilan-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 25px; padding: 20px 5%; }
        .kart { background: #161616; border: 1px solid #222; border-radius: 15px; overflow: hidden; position: relative; transition: 0.3s; }
        .kart:hover { border-color: #ffcc00; }
        .badge { position: absolute; top: 10px; right: 10px; padding: 5px 10px; border-radius: 6px; font-size: 10px; font-weight: bold; z-index: 10; background: #ffcc00; color: #000; }
        .araba-img { width: 100%; height: 180px; object-fit: cover; }
        .kart-body { padding: 15px; }
        .fiyat { color: #ffcc00; font-size: 22px; font-weight: 800; }
        .id-box { background: #222; padding: 6px; border-radius: 6px; font-size: 11px; color: #ffcc00; cursor: pointer; display: block; margin-top: 8px; border: 1px dashed #444; text-align: center; }
        .btn-rapor { background: #ff444422; color: #ff4444; border: 1px solid #ff4444; padding: 6px; border-radius: 6px; font-size: 11px; cursor: pointer; width: 100%; margin-top: 5px; font-weight: bold; }
        .btn-sil { background: #ff444422; color: #ff4444; border: 1px solid #ff4444; padding: 8px; border-radius: 5px; cursor: pointer; width: 100%; margin-top: 10px; }
        .btn-admin { background: #ff4444; color: white; padding: 8px 12px; text-decoration: none; border-radius: 5px; font-size: 12px; display: none; }
    </style>
</head>
<body>

<header>
    <div class="logo">CPM MARKET</div>
    <div class="user-info">
        <a href="admin.html" id="adminBtn" class="btn-admin">🛡️ ADMIN</a>
        <span id="aktifUser" style="color:#888; font-size:13px;"></span>
        <button onclick="cikisYap()" style="background:none; border:none; color:red; cursor:pointer; margin-left:10px;">ÇIKIŞ</button>
    </div>
</header>

<div class="search-container">
    <input type="text" id="searchBox" placeholder="İlan Ara..." onkeyup="ilanlariGetir()">
    <button class="btn-tab active" id="tab-hepsi" onclick="tabSet('hepsi')">Tümü</button>
    <button class="btn-tab" id="tab-benim" onclick="tabSet('benim')">İlanlarım</button>
    <a href="ilan-ver.html" style="background:#ffcc00; color:#000; padding:10px 15px; text-decoration:none; border-radius:8px; font-weight:bold;">+ İlan Ver</a>
</div>

<div class="ilan-grid" id="anaListe"></div>

<script>
    const firebaseConfig = {
        apiKey: "AIzaSyCDq7tCjNddgyEa-E3uYWLXNDY05f-bzzY",
        authDomain: "cpm-market-6d2cb.firebaseapp.com",
        databaseURL: "https://cpm-market-6d2cb-default-rtdb.firebaseio.com",
        projectId: "cpm-market-6d2cb",
        storageBucket: "cpm-market-6d2cb.firebasestorage.app",
        messagingSenderId: "47092040708",
        appId: "1:47092040708:web:8a811a9c4a77759a1ce151"
    };

    firebase.initializeApp(firebaseConfig);
    const database = firebase.database();
    const girisYapan = localStorage.getItem('oturum');
    const kullaniciRolu = localStorage.getItem('rol');
    let aktifTab = 'hepsi';

    if(!girisYapan) window.location.href = "giris.html";
    if(kullaniciRolu === "admin") document.getElementById('adminBtn').style.display = "block";
    document.getElementById('aktifUser').innerText = "@" + girisYapan;

    function tabSet(t) {
        aktifTab = t;
        document.querySelectorAll('.btn-tab').forEach(b => b.classList.remove('active'));
        document.getElementById('tab-' + t).classList.add('active');
        ilanlariGetir();
    }

    function ilanlariGetir() {
        const arama = document.getElementById('searchBox').value.toLowerCase();
        const liste = document.getElementById('anaListe');
        
        database.ref('arabalar').on('value', (snapshot) => {
            liste.innerHTML = "";
            snapshot.forEach((childSnapshot) => {
                const araba = childSnapshot.val();
                const fbId = childSnapshot.key;

                if (aktifTab === 'benim' && araba.sahibi !== girisYapan) return;
                if (arama && !araba.baslik.toLowerCase().includes(arama)) return;

                const resim = araba.foto || "https://via.placeholder.com/300x180/222/555?text=FOTO+YOK";
                const silButon = (kullaniciRolu === "admin" || araba.sahibi === girisYapan) 
                    ? `<button class="btn-sil" onclick="ilanSil('${fbId}')">SİL</button>` : '';

                liste.innerHTML += `
                    <div class="kart">
                        ${araba.etiket ? `<div class="badge">${araba.etiket}</div>` : ''}
                        <img src="${resim}" class="araba-img">
                        <div class="kart-body">
                            <div class="fiyat">${araba.fiyat}</div>
                            <div style="font-weight:bold;">${araba.baslik}</div>
                            <div style="font-size:12px; color:#888;">@${araba.sahibi}</div>
                            <div class="id-box" onclick="idKopyala('${araba.km}')">🆔 ID: ${araba.km}</div>
                            <button class="btn-rapor" onclick="ilanRaporla('${araba.baslik}', '${araba.sahibi}', '${araba.km}')">🚫 RAPORLA</button>
                            ${silButon}
                        </div>
                    </div>`;
            });
        });
    }

    function ilanSil(id) { if(confirm("Silinsin mi?")) database.ref('arabalar/' + id).remove(); }
    function idKopyala(id) { navigator.clipboard.writeText(id); alert("ID Kopyalandı!"); }
    function cikisYap() { localStorage.clear(); window.location.href="giris.html"; }
    window.onload = ilanlariGetir;
</script>
</body>
</html>
