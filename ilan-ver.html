<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>İlan Ver | Online</title>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>
    <style>
        body { background: #0a0a0a; color: white; font-family: sans-serif; padding: 20px; display: flex; justify-content: center; }
        .form-container { width: 100%; max-width: 400px; background: #111; padding: 25px; border-radius: 15px; border: 1px solid #ffcc00; }
        input, select, button { width: 100%; padding: 12px; margin: 8px 0; border-radius: 8px; border: 1px solid #333; background: #1a1a1a; color: white; outline: none; }
        button { background: #ffcc00; color: #000; font-weight: bold; border: none; cursor: pointer; margin-top: 15px; }
        .back { color: #888; text-align: center; display: block; text-decoration: none; font-size: 13px; margin-top: 10px; }
    </style>
</head>
<body>
<div class="form-container">
    <h2 style="color:#ffcc00; margin-bottom:15px;">Yeni İlan Ver</h2>
    <input type="text" id="baslik" placeholder="İlan Başlığı">
    <input type="text" id="fiyat" placeholder="Fiyat (Örn: 10M)">
    <input type="text" id="km" placeholder="Oyun İçi ID'niz">
    <input type="text" id="foto" placeholder="Fotoğraf Linki (Hızlıresim vb.)">
    <select id="etiket">
        <option value="">Etiket Seçin</option>
        <option value="🔥 Hız">Hız Canavarı</option>
        <option value="🔄 Takaslık">Takaslık</option>
        <option value="💎 Koleksiyon">Koleksiyonluk</option>
    </select>
    <button onclick="yayinla()">YAYINLA</button>
    <a href="index.html" class="back">Geri Dön</a>
</div>

<script>
    const firebaseConfig = {
        apiKey: "AIzaSyCDq7tCjNddgyEa-E3uYWLXNDY05f-bzzY",
        authDomain: "cpm-market-6d2cb.firebaseapp.com",
        databaseURL: "https://cpm-market-6d2cb-default-rtdb.firebaseio.com",
        projectId: "cpm-market-6d2cb",
        storageBucket: "cpm-market-6d2cb.firebasestorage.app",
        messagingSenderId: "47092040708",
        appId: "1:47092040708:web:8a811a9c4a77759a1ce151"
    };
    firebase.initializeApp(firebaseConfig);
    const database = firebase.database();
    const girisYapan = localStorage.getItem('oturum');

    function yayinla() {
        const b = document.getElementById('baslik').value;
        const f = document.getElementById('fiyat').value;
        const k = document.getElementById('km').value;
        const fo = document.getElementById('foto').value;
        const e = document.getElementById('etiket').value;

        if(!b || !f || !k) return alert("Eksikleri doldur kanka!");

        database.ref('arabalar').push({
            baslik: b, fiyat: f, km: k, foto: fo, etiket: e, sahibi: girisYapan
        }).then(() => {
            alert("İlan Yayında!");
            window.location.href = "index.html";
        });
    }
</script>
</body>
</html>
