<!DOCTYPE html>
<html lang="tr">
<head>
    <link rel="icon" type="image/jpeg" href="favicon.jpg">
    <meta charset="UTF-8">
    <title>İlan Ver | Car Parking</title>
    <style>
        body { background: #000; color: white; font-family: sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .form-kutu { background: #111; padding: 40px; border-radius: 20px; border: 2px solid #ffcc00; width: 350px; }
        h2 { color: #ffcc00; text-align: center; margin-bottom: 20px; text-transform: uppercase; }
        label { color: #888; font-size: 12px; display: block; margin-bottom: 5px; margin-top: 10px; }
        input, select { width: 100%; padding: 12px; margin-bottom: 10px; background: #222; border: 1px solid #333; color: white; border-radius: 8px; box-sizing: border-box; outline: none; }
        input:focus, select:focus { border-color: #ffcc00; }
        .kaydet { width: 100%; padding: 15px; background: #ffcc00; color: black; border: none; font-weight: bold; cursor: pointer; border-radius: 8px; font-size: 16px; margin-top: 20px; transition: 0.3s; }
        .kaydet:hover { background: #fff; transform: scale(1.02); }
        .iptal { display: block; text-align: center; margin-top: 15px; color: #555; text-decoration: none; font-size: 14px; }
    </style>
</head>
<body>

<div class="form-kutu">
    <h2>ARAÇ EKLE</h2>
    
    <label>ARAÇ İSMİ</label>
    <input type="text" id="baslik" placeholder="Örn: BMW M5 E60">
    
    <label>FİYAT (Oyun İçi Para)</label>
    <input type="text" id="fiyat" placeholder="Örn: 50.000.000$">
    
    <label>KİLOMETRE / MOTOR</label>
    <input type="text" id="km" placeholder="Örn: 1500 KM / 1695 HP">
    
    <label>ARAÇ ETİKETİ (ÖZELLİK)</label>
    <select id="etiket">
        <option value="">Özellik Yok</option>
        <option value="Hız Canavarı">🔥 Hız Canavarı</option>
        <option value="Takaslık">🔄 Takasa Açık</option>
        <option value="Koleksiyonluk">💎 Koleksiyonluk</option>
        <option value="Acil Satılık">⚠ Acil Satılık</option>
        <option value="Efsane Tasarım">🎨 Efsane Tasarım</option>
    </select>
    
    <label>ARAÇ FOTOĞRAFI</label>
    <input type="file" id="foto" accept="image/*">

    <button class="kaydet" onclick="veriyiKaydet()">PAZARA GÖNDER</button>
    <a href="index.html" class="iptal">Vazgeç ve Dön</a>
</div>

<script>
    function veriyiKaydet() {
        const baslik = document.getElementById('baslik').value;
        const fiyat = document.getElementById('fiyat').value;
        const km = document.getElementById('km').value;
        const etiket = document.getElementById('etiket').value; // Etiketi aldık
        const fotoInput = document.getElementById('foto');
        const aktifKullanici = localStorage.getItem('oturum'); // Giriş yapan kim?

        if(!baslik || !fiyat) { 
            alert("İsim ve fiyat boş olamaz kanka!"); 
            return; 
        }

        const reader = new FileReader();
        
        if (fotoInput.files[0]) {
            reader.readAsDataURL(fotoInput.files[0]);
            reader.onload = function () {
                kaydet(reader.result);
            };
        } else {
            kaydet(""); 
        }

        function kaydet(fotoData) {
            const yeniAraba = { 
                baslik: baslik, 
                fiyat: fiyat, 
                km: km, 
                etiket: etiket, // Etiketi kaydettik
                foto: fotoData,
                sahibi: aktifKullanici, // İlanın sahibi pipi mi admin mi belli olsun
                mesajlar: [] // Sohbet için boş liste
            };
            
            let ilanlar = JSON.parse(localStorage.getItem('arabalar')) || [];
            ilanlar.push(yeniAraba);
            localStorage.setItem('arabalar', JSON.stringify(ilanlar));
            
            alert("İlanın pazara düştü babyyy!");
            window.location.href = "index.html";
        }
    }
</script>
</body>
</html>
