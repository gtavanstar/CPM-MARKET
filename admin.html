<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>Car Parking | ADMIN PANEL</title>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>
    <style>
        body { background: #050505; color: white; font-family: sans-serif; padding: 20px; }
        .admin-kutu { background: #111; border: 2px solid #ff4444; border-radius: 10px; padding: 20px; max-width: 1000px; margin: 0 auto; }
        h1 { color: #ff4444; text-align: center; text-transform: uppercase; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; background: #161616; }
        th, td { border: 1px solid #333; padding: 12px; text-align: left; }
        th { background: #222; color: #ffcc00; }
        .btn-arsiv { background: #ffaa00; color: black; border: none; padding: 8px 15px; cursor: pointer; border-radius: 5px; font-weight: bold; }
        .btn-geri { background: #333; color: white; padding: 10px 20px; text-decoration: none; display: inline-block; margin-bottom: 20px; border-radius: 5px; }
        img { border-radius: 4px; object-fit: cover; background: #222; }
    </style>
</head>
<body>

    <a href="index.html" class="btn-geri">← Pazara Dön</a>
    
    <div class="admin-kutu">
        <h1>🛡️ Sistem Yönetim Paneli</h1>
        <div id="istatistik" style="margin-bottom: 20px; color: #888;">Yükleniyor...</div>
        
        <table>
            <thead>
                <tr>
                    <th>Görsel</th>
                    <th>Araç Başlığı</th>
                    <th>Fiyat</th>
                    <th>Satıcı</th>
                    <th>İşlem</th>
                </tr>
            </thead>
            <tbody id="adminListe"></tbody>
        </table>
    </div>

<script>
    const firebaseConfig = {
        apiKey: "AIzaSyCDq7tCjNddgyEa-E3uYWLXNDY05f-bzzY",
        authDomain: "cpm-market-6d2cb.firebaseapp.com",
        databaseURL: "https://cpm-market-6d2cb-default-rtdb.firebaseio.com",
        projectId: "cpm-market-6d2cb",
        storageBucket: "cpm-market-6d2cb.firebasestorage.app",
        messagingSenderId: "47092040708",
        appId: "1:47092040708:web:8a811a9c4a77759a1ce151"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    function ilanlariYukle() {
        // BURASI ÇOK ÖNEMLİ: 'arabalar' klasörüne bakıyoruz!
        db.ref('arabalar').on('value', (snapshot) => {
            const liste = document.getElementById('adminListe');
            liste.innerHTML = "";
            let sayac = 0;

            if(!snapshot.exists()) {
                liste.innerHTML = `<tr><td colspan="5" style="text-align:center; padding:30px;">İlan bulunamadı kanka.</td></tr>`;
                return;
            }

            snapshot.forEach((childSnapshot) => {
                const araba = childSnapshot.val();
                const key = childSnapshot.key;
                sayac++;
                
                // Resim hatası için alternatif link ekledim
                const resimSrc = araba.foto || "https://dummyimage.com/60x40/333/fff&text=Resim+Yok";
                
                liste.innerHTML += `
                    <tr>
                        <td><img src="${resimSrc}" width="60" height="40" onerror="this.src='https://dummyimage.com/60x40/333/fff&text=Hata'"></td>
                        <td>${araba.baslik || "Başlıksız"}</td>
                        <td style="color:#ffcc00; font-weight:bold;">${araba.fiyat || "0"}</td>
                        <td>@${araba.sahibi || "Bilinmiyor"}</td>
                        <td><button class="btn-arsiv" onclick="ilaniArsivle('${key}')">SİL / ARŞİVLE</button></td>
                    </tr>`;
            });
            document.getElementById('istatistik').innerText = "Toplam İlan: " + sayac;
        });
    }

    function ilaniArsivle(key) {
        if(confirm("Bu ilanı veritabanından silmek istediğine emin misin?")) {
            db.ref('arabalar/' + key).remove().then(() => {
                alert("İlan başarıyla silindi!");
            });
        }
    }

    window.onload = ilanlariYukle;
</script>
</body>
</html>
