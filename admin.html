    <style>

<body>

        <div id="istatistik" style="margin-bottom: 20px; color: #888; font-weight: bold; background: #1a1a1a; padding: 10px; border-radius: 5px;">Yükleniyor...</div>
        
        <table id="adminTablo">

                <tr>
                    <th>Görsel</th>

                    <th>Fiyat</th>
                    <th>Satıcı</th>
                    <th>İşlem</th>
                </tr>
            </thead>
            <tbody id="adminListe"></tbody>
        </table>
    </div>

<script>
    const firebaseConfig = {
        apiKey: "AIzaSyCDq7tCjNddgyEa-E3uYWLXNDY05f-bzzY",
        authDomain: "cpm-market-6d2cb.firebaseapp.com",
        databaseURL: "https://cpm-market-6d2cb-default-rtdb.firebaseio.com",
        projectId: "cpm-market-6d2cb",
        storageBucket: "cpm-market-6d2cb.firebasestorage.app",
        messagingSenderId: "47092040708",
        appId: "1:47092040708:web:8a811a9c4a77759a1ce151"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    const kullaniciRolu = localStorage.getItem('rol');
    if(kullaniciRolu !== 'admin') {
        alert("Burası senin boyunu aşar kanka!");
        window.location.href = "index.html";
    }

    function ilanlariYukle() {
    db.ref().on('value', (snapshot) => {
        console.log("TÜM VERİTABANI:", snapshot.val()); // Veritabanında ne varsa konsola döker
        if(snapshot.exists()){
            console.log("İlanlar klasörü içeriği:", snapshot.child('ilanlar').val());
        } else {
            console.log("Veritabanı tamamen boş!");
        }
    });
}
            }

            snapshot.forEach((childSnapshot) => {
                const araba = childSnapshot.val();
                const key = childSnapshot.key;
                sayac++;
                
                const resimSrc = araba.foto || araba.resim || "https://via.placeholder.com/60x40/222/555?text=Resim+Yok";
                
                liste.innerHTML += `
                    <tr>
                        <td><img src="${resimSrc}" width="60" height="40"></td>
                        <td>${araba.baslik || "Başlıksız"}</td>
                        <td style="color:#ffcc00; font-weight:bold;">${araba.fiyat || "0"}</td>
                        <td>@${araba.sahibi || "Bilinmiyor"}</td>
                        <td><button class="btn-arsiv" onclick="ilaniArsivle('${key}')">ARŞİVE KALDIR</button></td>
                    </tr>`;
            });
            document.getElementById('istatistik').innerText = "Sistemdeki Toplam İlan: " + sayac;
        }, (error) => {
            console.error("Firebase Hatası:", error);
            alert("Veriler çekilemedi!");
        });
    }

    function ilaniArsivle(key) {
        if(confirm("Bu ilan pazardan çekilecek ve arşive eklenecek. Onaylıyor musun başkan?")) {
            db.ref('ilanlar/' + key).once('value').then((snapshot) => {
                if(snapshot.exists()) {
                    const veri = snapshot.val();
                    db.ref('arsiv/' + key).set(veri).then(() => {
                        db.ref('ilanlar/' + key).remove().then(() => {
                            alert("İlan başarıyla arşive kaldırıldı!");
                        });
                    });
                }
            });
        }
    }

    window.onload = ilanlariYukle;
</script>
